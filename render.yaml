services:
  # ----------------------------------------------------
  # 1. IRONPULSE Backend Web Service (Node.js + Express)
  # ----------------------------------------------------
  - type: web
    name: ironpulse-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false

  # ----------------------------------------------------
  # 2. IRONPULSE Frontend Static Site (React.js + Vite)
  # ----------------------------------------------------
  - type: web
    name: ironpulse-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
